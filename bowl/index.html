<meta charset="utf-8">
<title>Piñata Fishbowl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gluten:wght@700;800&family=Figtree:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: the bowl fills the window; a name plate floats top-left; the dozen fish sit as cards in a tray along the bottom.
   One deliberate look (a dim plum room so the paper colours glow), so a single theme by choice. */
:root {
  --room: #241a33;
  --tray: #1a1226;
  --card: #33264a;
  --chip: #4a3866;
  --line: #8f7aa8;
  --paper: #fff4e2;
  --muted: #cdbbe0;
  --pink: #ff4f8b;
  --marigold: #ffb320;
  --teal: #3fd6c3;
  --display: "Gluten", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--room); color: var(--paper); font-family: var(--body); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; touch-action: none; cursor: grab; }
#stage canvas.over-fish { cursor: pointer; }

.plate {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 16px;
  max-width: min(400px, calc(100% - 32px)); display: grid; gap: 8px; pointer-events: none;
}
.plate > * { pointer-events: auto; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 5.5vw, 48px); line-height: .95; margin: 0; text-wrap: balance; }
h1 .a { color: var(--pink); }
h1 .b { color: var(--marigold); }
.plate p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; max-width: 36ch; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
button { font: 600 14px var(--body); border: 0; border-radius: 999px; padding: 8px 15px; cursor: pointer; color: var(--room); background: var(--marigold); }
button.ghost { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 1.5px var(--line); }
button:hover { filter: brightness(1.08); }
button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.status { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); font-variant-numeric: tabular-nums; min-height: 1em; }

.tray {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 28px 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
  background: linear-gradient(to top, var(--tray) 55%, transparent);
}
.cards { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; scrollbar-color: var(--chip) transparent; }
.card { flex: 0 0 auto; width: 214px; background: var(--card); border-radius: 12px; padding: 10px 12px 11px; display: grid; gap: 7px; align-content: start; }
.card .name { font-style: italic; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .meta { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font: 600 12px var(--body); padding: 4px 9px; border-radius: 999px; background: var(--chip); color: var(--paper); }
.chip.wild { color: var(--marigold); }
.chip[aria-pressed="true"] { background: var(--pink); color: var(--paper); }

@media (max-width: 640px) {
  .plate p { font-size: 13px; }
  .card { width: 176px; }
  .tray { padding-top: 20px; }
}
</style>

<div id="stage"></div>

<header class="plate">
  <h1><span class="a">Piñata</span> <span class="b">Fishbowl</span></h1>
  <p>Twelve paper fish grown from fishdraw shapes, each in three colourways and two wildcards. Tap a fish to change its paper.</p>
  <div class="actions">
    <button id="feed" type="button">Sprinkle food</button>
    <button id="shuffle" class="ghost" type="button">Shuffle colours</button>
    <button id="toggle-tray" class="ghost" type="button" aria-expanded="true" aria-controls="tray">Hide fish</button>
  </div>
  <div class="status" id="status" role="status">Netting fish…</div>
</header>

<section class="tray" id="tray" aria-label="The fish in the bowl">
  <div class="cards" id="cards"></div>
</section>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---- bowl dimensions (world units; a fish's paper body is 3.6 long before scaling) ----
const R = 14, LIP = 10.5, FLOOR = -12, WATER = 8, FISH_SCALE = 1.05;
const ringR = y => Math.sqrt(Math.max(0, R * R - y * y));

const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
{ // a dim plum wall with a warm pool of lamp light behind the bowl
  const c = document.createElement("canvas"); c.width = 16; c.height = 512;
  const g = c.getContext("2d"), grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0, "#1c1429"); grad.addColorStop(0.55, "#3d2a52"); grad.addColorStop(1, "#5a3c5c");
  g.fillStyle = grad; g.fillRect(0, 0, 16, 512);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.5, 400);
const fitCamera = () => {
  const far = innerWidth / innerHeight < 0.8 ? 72 : 50;
  camera.position.set(0, 7, far);
};
fitCamera();
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -2, 0);
controls.enableDamping = true;
controls.minDistance = 18; controls.maxDistance = 95;
controls.maxPolarAngle = 1.72;
controls.autoRotate = !reduceMotion; controls.autoRotateSpeed = 0.35;
let idleTimer;
controls.addEventListener("start", () => { controls.autoRotate = false; clearTimeout(idleTimer); });
controls.addEventListener("end", () => { idleTimer = setTimeout(() => controls.autoRotate = !reduceMotion, 9000); });

scene.add(new THREE.HemisphereLight(0xfff0dc, 0x6a4c6c, 2.3));
const sun = new THREE.DirectionalLight(0xfff6e8, 3.2);
sun.position.set(12, 34, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 5, far: 80 });
sun.shadow.bias = -0.0008;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xb9a6ff, 0.8);
fill.position.set(-20, 6, -10);
scene.add(fill);

const time = { value: 0 };

// ---- glass, water and surface ----
const glassMat = (side, base, rim) => new THREE.ShaderMaterial({
  side, transparent: true, depthWrite: false,
  uniforms: { uBase: { value: base }, uRim: { value: rim }, uTint: { value: new THREE.Color(0xdff6ff) } },
  vertexShader: `varying vec3 vN; varying vec3 vV;
    void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix*normal); vV = -mv.xyz; gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `uniform float uBase; uniform float uRim; uniform vec3 uTint; varying vec3 vN; varying vec3 vV;
    void main(){
      vec3 n = normalize(vN); vec3 v = normalize(vV); if (!gl_FrontFacing) n = -n;
      float f = pow(1.0 - abs(dot(n, v)), 3.0);
      vec3 L1 = normalize(vec3(0.45, 0.7, 0.55)), L2 = normalize(vec3(-0.7, 0.35, 0.6));
      vec3 r = reflect(-v, n);
      float spec = pow(max(dot(r, L1), 0.0), 90.0) * 1.4 + pow(max(dot(r, L2), 0.0), 40.0) * 0.35;
      gl_FragColor = vec4(mix(uTint, vec3(1.0), f) , clamp(uBase + uRim * f + spec, 0.0, 0.95));
    }`,
});
const bowlTheta0 = Math.acos(LIP / R), bowlTheta1 = Math.acos(FLOOR / R);
const bowlGeo = new THREE.SphereGeometry(R, 96, 64, 0, Math.PI * 2, bowlTheta0, bowlTheta1 - bowlTheta0);
const bowlBack = new THREE.Mesh(bowlGeo, glassMat(THREE.BackSide, 0.03, 0.35)); bowlBack.renderOrder = 1;
const bowlFront = new THREE.Mesh(bowlGeo, glassMat(THREE.FrontSide, 0.02, 0.55)); bowlFront.renderOrder = 20;
scene.add(bowlBack, bowlFront);
const lip = new THREE.Mesh(new THREE.TorusGeometry(ringR(LIP), 0.28, 16, 128), glassMat(THREE.FrontSide, 0.25, 0.5));
lip.rotation.x = Math.PI / 2; lip.position.y = LIP; lip.renderOrder = 21; scene.add(lip);

const waterMat = (side, a) => new THREE.ShaderMaterial({
  side, transparent: true, depthWrite: false,
  uniforms: { uA: { value: a } },
  vertexShader: `varying vec3 vN; varying vec3 vV; varying float vY;
    void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0); vN = normalize(normalMatrix*normal); vV = -mv.xyz; vY = position.y; gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `uniform float uA; varying vec3 vN; varying vec3 vV; varying float vY;
    void main(){
      float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.0);
      float deep = clamp((${WATER.toFixed(1)} - vY) / 20.0, 0.0, 1.0);
      vec3 c = mix(vec3(0.55, 0.88, 0.92), vec3(0.18, 0.45, 0.62), deep);
      gl_FragColor = vec4(c, uA + 0.18 * f);
    }`,
});
const WR = R - 0.2, wTheta0 = Math.acos(WATER / WR), wTheta1 = Math.acos(FLOOR / WR);
const waterGeo = new THREE.SphereGeometry(WR, 96, 48, 0, Math.PI * 2, wTheta0, wTheta1 - wTheta0);
const waterBack = new THREE.Mesh(waterGeo, waterMat(THREE.BackSide, 0.16)); waterBack.renderOrder = 2;
const waterFront = new THREE.Mesh(waterGeo, waterMat(THREE.FrontSide, 0.07)); waterFront.renderOrder = 19;
scene.add(waterBack, waterFront);

const surfaceGeo = new THREE.CircleGeometry(Math.sqrt(WR * WR - WATER * WATER), 96, 0, Math.PI * 2);
surfaceGeo.rotateX(-Math.PI / 2);
const surface = new THREE.Mesh(surfaceGeo, new THREE.ShaderMaterial({
  side: THREE.DoubleSide, transparent: true, depthWrite: false,
  uniforms: { uTime: time },
  vertexShader: `uniform float uTime; varying vec3 vW; varying vec3 vV;
    void main(){ vec3 p = position;
      p.y += sin(p.x*0.7 + uTime*1.3)*0.08 + sin(p.z*0.9 - uTime*1.1)*0.07;
      vW = p; vec4 mv = modelViewMatrix*vec4(p,1.0); vV = -mv.xyz; gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `uniform float uTime; varying vec3 vW; varying vec3 vV;
    void main(){
      float r = sin(length(vW.xz)*1.6 - uTime*1.8)*0.5+0.5;
      float glint = smoothstep(0.92, 1.0, sin(vW.x*2.1+uTime)*sin(vW.z*1.7-uTime*0.8));
      vec3 c = mix(vec3(0.62,0.9,0.95), vec3(1.0), r*0.25 + glint*0.6);
      gl_FragColor = vec4(c, 0.22 + r*0.06 + glint*0.35);
    }`,
}));
surface.position.y = WATER; surface.renderOrder = 18; scene.add(surface);

const base = new THREE.Mesh(new THREE.CircleGeometry(ringR(FLOOR), 64), glassMat(THREE.DoubleSide, 0.08, 0.3));
base.rotation.x = -Math.PI / 2; base.position.y = FLOOR - 0.02; base.renderOrder = 3; scene.add(base);

// ---- the table it stands on ----
const wood = new THREE.Mesh(new THREE.CylinderGeometry(34, 34, 1.4, 96), new THREE.MeshStandardMaterial({ color: 0x8a5634, roughness: 0.7 }));
wood.position.y = FLOOR - 0.72; wood.receiveShadow = true; scene.add(wood);
const doily = new THREE.Mesh(new THREE.CircleGeometry(ringR(FLOOR) + 4.2, 40), new THREE.MeshStandardMaterial({ color: 0xf6e9d6, roughness: 0.95 }));
doily.rotation.x = -Math.PI / 2; doily.position.y = FLOOR - 0.015; doily.receiveShadow = true; scene.add(doily);

// ---- swaying helper: bends a mesh by height, like paper in a current ----
function sway(mat, phase, strength) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = time; sh.uniforms.uPhase = { value: phase }; sh.uniforms.uStr = { value: strength };
    sh.vertexShader = "uniform float uTime; uniform float uPhase; uniform float uStr;\n" + sh.vertexShader.replace("#include <begin_vertex>",
      `vec3 transformed = position;
       float hh = max(position.y, 0.0);
       transformed.x += sin(uTime*1.1 + uPhase + hh*0.45) * hh*hh * 0.018 * uStr;
       transformed.z += cos(uTime*0.9 + uPhase*1.7 + hh*0.38) * hh*hh * 0.012 * uStr;`);
  };
  mat.customProgramCacheKey = () => "sway";
  return mat;
}

// ---- gravel: chunky paper-mache pebbles following the curve of the glass ----
const rand = (a, b) => a + Math.random() * (b - a);
{
  const pebbleColours = [0xff6f91, 0xffc94a, 0x3fd6c3, 0x8e7cff, 0xfff1dc, 0xff8a3d, 0x6fd36a].map(c => new THREE.Color(c));
  const n = 760, geo = new THREE.IcosahedronGeometry(0.42, 0);
  const pebbles = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ roughness: 0.85, flatShading: true }), n);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), r = Math.sqrt(Math.random()) * 10.2;
    const wall = -Math.sqrt(Math.max(0, (R - 0.7) ** 2 - r * r));
    const y = Math.max(FLOOR + 0.35, wall + 0.45) + Math.random() * 0.9 + Math.max(0, 1.1 - r / 6) * Math.random();
    p.set(Math.cos(a) * r, y, Math.sin(a) * r);
    q.setFromEuler(new THREE.Euler(rand(0, 6), rand(0, 6), rand(0, 6)));
    const k = rand(0.55, 1.15); s.set(k * rand(0.9, 1.4), k * rand(0.6, 0.9), k);
    pebbles.setMatrixAt(i, m.compose(p, q, s));
    pebbles.setColorAt(i, pebbleColours[i % pebbleColours.length]);
  }
  pebbles.receiveShadow = true; pebbles.castShadow = true;
  scene.add(pebbles);
}

// ---- weeds: fans of crepe-paper streamers rooted in the gravel ----
{
  const greens = [0x48c774, 0x2fae8f, 0x9be15d, 0x1f8f6a, 0xffd36e, 0xff7aa8];
  const spots = [[-7.5, -3.5], [6.8, -5], [-3, 6.8], [8.2, 3.6], [-9.2, 2.2], [1.5, -8.2], [3.8, 7.6]];
  spots.forEach(([x, z], si) => {
    const blades = 3 + (si % 3);
    for (let b = 0; b < blades; b++) {
      const h = rand(3.5, 8) * (si === 2 || si === 5 ? 1.25 : 1);
      const geo = new THREE.PlaneGeometry(rand(0.55, 0.9), h, 1, 18);
      geo.translate(0, h / 2, 0);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) { const t = pos.getY(i) / h; pos.setX(i, pos.getX(i) * (1 - t * 0.75)); }
      const colour = si % 3 === 2 && b % 2 ? greens[4 + (b % 2)] : greens[(b + si) % 4];
      const blade = new THREE.Mesh(geo, sway(new THREE.MeshStandardMaterial({ color: colour, side: THREE.DoubleSide, roughness: 0.9 }), si * 1.7 + b, rand(0.8, 1.3)));
      const r = Math.hypot(x, z), floorY = Math.max(FLOOR + 0.6, -Math.sqrt(Math.max(0, (R - 0.7) ** 2 - r * r)) + 0.8);
      blade.position.set(x + rand(-0.6, 0.6), floorY, z + rand(-0.6, 0.6));
      blade.rotation.set(rand(-0.12, 0.12), rand(0, Math.PI), rand(-0.15, 0.15));
      blade.castShadow = true;
      scene.add(blade);
    }
  });
}

// ---- bubbles from a little paper bubbler ----
const BUBBLER = new THREE.Vector3(-5.5, FLOOR + 1.3, -4);
const bubbleCount = 36;
const bubbles = new THREE.InstancedMesh(new THREE.SphereGeometry(0.16, 12, 8),
  new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.55, roughness: 0.1 }), bubbleCount);
bubbles.renderOrder = 5;
const bubbleState = Array.from({ length: bubbleCount }, () => ({ y: rand(FLOOR, WATER), s: rand(0.5, 1.4), ph: rand(0, 6), v: rand(2.2, 3.4) }));
scene.add(bubbles);
{
  const chest = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.3, 1.2, 8), new THREE.MeshStandardMaterial({ color: 0xff4f8b, roughness: 0.8, flatShading: true }));
  chest.position.copy(BUBBLER).add(new THREE.Vector3(0, -0.6, 0)); chest.castShadow = true; scene.add(chest);
}

// ---- paper confetti, shared by colour swaps and food ----
const CONFETTI = 360;
const confetti = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.34, 0.16), new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.9 }), CONFETTI);
confetti.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
const confettiState = Array.from({ length: CONFETTI }, () => ({ life: 0 }));
const confettiColours = [0xff4f8b, 0xffb320, 0x3fd6c3, 0x8e7cff, 0xfff4e2, 0xff8a3d].map(c => new THREE.Color(c));
let confettiNext = 0;
for (let i = 0; i < CONFETTI; i++) { confetti.setColorAt(i, confettiColours[i % confettiColours.length]); }
scene.add(confetti);
function burst(at, n = 40, speed = 4) {
  for (let k = 0; k < n; k++) {
    const c = confettiState[confettiNext]; confettiNext = (confettiNext + 1) % CONFETTI;
    c.life = rand(1.2, 2.2); c.max = c.life;
    c.p = at.clone().add(new THREE.Vector3(rand(-0.5, 0.5), rand(-0.5, 0.5), rand(-0.5, 0.5)));
    c.v = new THREE.Vector3(rand(-1, 1), rand(-0.4, 1.2), rand(-1, 1)).normalize().multiplyScalar(rand(0.4, 1) * speed);
    c.r = new THREE.Euler(rand(0, 6), rand(0, 6), rand(0, 6)); c.spin = rand(2, 7);
  }
}

// ---- food flakes ----
const food = [];
const flakeGeo = new THREE.CircleGeometry(0.22, 6);
const flakeMat = new THREE.MeshStandardMaterial({ color: 0xffb320, side: THREE.DoubleSide, roughness: 0.9 });
function sprinkle() {
  const n = 12;
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), r = Math.sqrt(Math.random()) * (ringR(WATER) - 3);
    const m = new THREE.Mesh(flakeGeo, flakeMat);
    m.position.set(Math.cos(a) * r, WATER - 0.05, Math.sin(a) * r);
    m.rotation.set(rand(0, 6), rand(0, 6), 0);
    m.userData = { delay: i * 0.08, sink: rand(0.9, 1.5), ph: rand(0, 6), rest: 0 };
    scene.add(m); food.push(m);
  }
}
function eat(flake) {
  const i = food.indexOf(flake); if (i < 0) return;
  food.splice(i, 1); scene.remove(flake);
  burst(flake.position, 8, 1.6);
}

// ---- fish ----
const draco = new DRACOLoader();
draco.setDecoderPath("draco/");
draco.setDecoderConfig({ type: "js" });
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);
const gltfCache = new Map();
const loadFish = file => {
  // each GLB ships as base64 text (fish/<name>.glb.txt), the form the artifact host serves
  if (!gltfCache.has(file)) gltfCache.set(file, fetch("fish/" + file + ".txt")
    .then(r => { if (!r.ok) throw new Error(file + " " + r.status); return r.text(); })
    .then(b64 => loader.parseAsync(Uint8Array.from(atob(b64.trim()), c => c.charCodeAt(0)).buffer, "")));
  return gltfCache.get(file);
};

const SWIM_HEAD = `uniform mat4 uFish; uniform mat4 uFishInv; uniform float uAmp; uniform float uSwim; uniform float uTurn;\n`;
const SWIM_BODY = `
  vec4 fishP = uFishInv * (modelMatrix * vec4(transformed, 1.0));
  float back = clamp((1.3 - fishP.x) / 5.0, 0.0, 1.0);
  float wag = 0.1 + back * back * 1.7;
  fishP.z += sin(fishP.x * 1.2 + uSwim) * uAmp * wag + uTurn * back * back * 1.1;
  vec4 mvPosition = viewMatrix * (uFish * fishP);
  gl_Position = projectionMatrix * mvPosition;`;
function swimMaterial(src, u) {
  const mat = src.clone();
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, u);
    sh.vertexShader = SWIM_HEAD + sh.vertexShader.replace("#include <project_vertex>", SWIM_BODY);
  };
  mat.customProgramCacheKey = () => "swim";
  return mat;
}

function safeRadius(y) { return Math.max(1.5, Math.sqrt(Math.max(0, (R - 1) ** 2 - y * y)) - 4.0); }
const Y_MIN = FLOOR + 4.2, Y_MAX = WATER - 2.2;
function randomSpot(v = new THREE.Vector3()) {
  const y = rand(Y_MIN, Y_MAX), a = rand(0, Math.PI * 2), r = Math.sqrt(Math.random()) * safeRadius(y);
  return v.set(Math.cos(a) * r, y, Math.sin(a) * r);
}

const fishes = [];
const pickables = [];
const UP = new THREE.Vector3(0, 1, 0);
const tmp = { a: new THREE.Vector3(), b: new THREE.Vector3(), c: new THREE.Vector3(), m: new THREE.Matrix4(), q: new THREE.Quaternion() };

class Fish {
  constructor(entry, index) {
    this.entry = entry; this.index = index;
    this.group = new THREE.Group();
    this.group.scale.setScalar(FISH_SCALE);
    this.pos = randomSpot(); this.group.position.copy(this.pos);
    this.vel = new THREE.Vector3(rand(-1, 1), 0, rand(-1, 1)).normalize().multiplyScalar(2);
    this.target = randomSpot();
    this.cruise = rand(1.6, 2.6);
    this.nextTarget = rand(3, 8);
    this.dash = 0;
    this.turn = 0; this.prevYaw = Math.atan2(this.vel.z, this.vel.x);
    this.uniforms = { uFish: { value: this.group.matrixWorld }, uFishInv: { value: new THREE.Matrix4() }, uAmp: { value: 0.2 }, uSwim: { value: rand(0, 6) }, uTurn: { value: 0 } };
    this.version = -1; this.model = null; this.loading = 0;
    scene.add(this.group);
  }
  async setVersion(v, withBurst) {
    const ticket = ++this.loading;
    const gltf = await loadFish(this.entry.versions[v].file);
    if (ticket !== this.loading) return;
    if (this.model) {
      this.group.remove(this.model);
      this.model.traverse(o => { if (o.isMesh) { pickables.splice(pickables.indexOf(o), 1); o.material.dispose(); } });
    }
    const model = gltf.scene.clone(true);
    model.traverse(o => {
      if (!o.isMesh) return;
      o.material = swimMaterial(o.material, this.uniforms);
      o.castShadow = true; o.frustumCulled = false;
      o.userData.fish = this;
      pickables.push(o);
    });
    this.model = model; this.version = v;
    this.group.add(model);
    if (withBurst) burst(this.pos, 46, 5);
    updateCard(this);
  }
  update(dt, t) {
    // pick where to go: the nearest food if there is any, otherwise a wander point
    let goal = this.target, hungry = null;
    if (food.length) {
      let best = 1e9;
      for (const f of food) {
        if (f.userData.delay > 0) continue;
        const d = f.position.distanceToSquared(this.pos);
        if (d < best) { best = d; hungry = f; }
      }
      if (hungry) goal = hungry.position;
    }
    this.nextTarget -= dt;
    if (!hungry && (this.nextTarget <= 0 || this.pos.distanceTo(this.target) < 2.5)) {
      randomSpot(this.target); this.nextTarget = rand(4, 10);
      if (Math.random() < 0.18) this.dash = rand(0.6, 1.2);
    }
    this.dash = Math.max(0, this.dash - dt);
    const speed = this.cruise * (hungry ? 1.9 : 1) * (this.dash > 0 ? 2.4 : 1);

    const desired = tmp.a.subVectors(goal, this.pos);
    if (desired.lengthSq() > 1e-4) desired.normalize().multiplyScalar(speed);
    // keep a fish's length of space from the others
    for (const o of fishes) {
      if (o === this) continue;
      const away = tmp.b.subVectors(this.pos, o.pos);
      const d = away.length();
      if (d < 5.4 && d > 1e-3) desired.addScaledVector(away, (5.4 - d) / d * 1.4);
    }
    // stay inside the water
    const y = this.pos.y, hr = Math.hypot(this.pos.x, this.pos.z), lim = safeRadius(y);
    if (hr > lim) desired.add(tmp.b.set(-this.pos.x, 0, -this.pos.z).normalize().multiplyScalar((hr - lim) * 3));
    if (y > Y_MAX) desired.y -= (y - Y_MAX) * 3;
    if (y < Y_MIN) desired.y += (Y_MIN - y) * 3;

    this.vel.lerp(desired, 1 - Math.exp(-dt * (hungry ? 2.4 : 1.3)));
    const horiz = Math.hypot(this.vel.x, this.vel.z);
    this.vel.y = THREE.MathUtils.clamp(this.vel.y, -0.5 * horiz - 0.2, 0.5 * horiz + 0.2);
    this.pos.addScaledVector(this.vel, dt);
    this.group.position.copy(this.pos);

    // face along the velocity, banking into turns
    const fwd = tmp.a.copy(this.vel);
    if (fwd.lengthSq() > 1e-4) {
      fwd.normalize();
      const up = tmp.b.copy(UP).addScaledVector(fwd, -fwd.dot(UP)).normalize();
      const side = tmp.c.crossVectors(fwd, up);
      tmp.m.makeBasis(fwd, up, side);
      tmp.q.setFromRotationMatrix(tmp.m);
      const yaw = Math.atan2(fwd.z, fwd.x);
      let dy = yaw - this.prevYaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
      this.prevYaw = yaw;
      this.turn = THREE.MathUtils.lerp(this.turn, THREE.MathUtils.clamp(dy / Math.max(dt, 1e-3) * 0.35, -0.9, 0.9), 1 - Math.exp(-dt * 4));
      const bank = new THREE.Quaternion().setFromAxisAngle(fwd, -this.turn * 0.35);
      tmp.q.premultiply(bank);
      this.group.quaternion.slerp(tmp.q, 1 - Math.exp(-dt * 5));
    }
    const pace = this.vel.length();
    this.uniforms.uSwim.value += dt * (3.2 + pace * 1.6);
    this.uniforms.uAmp.value = 0.12 + Math.min(pace, 6) * 0.03;
    this.uniforms.uTurn.value = this.turn;

    // a nibble: food that reaches the mouth is eaten
    if (hungry) {
      const mouth = tmp.b.copy(this.pos).addScaledVector(tmp.a, 1.6 * FISH_SCALE);
      if (mouth.distanceTo(hungry.position) < 1.1) eat(hungry);
    }
  }
}

// ---- tray of cards ----
const cards = document.getElementById("cards");
const status = document.getElementById("status");
function chipLabel(label) {
  if (label.startsWith("Colour ")) return label.slice(7);
  return label.replace("Wildcard: ", "");
}
function buildCard(fish) {
  const card = document.createElement("article");
  card.className = "card";
  const e = fish.entry;
  card.innerHTML = `<div class="name" title="${e.name}">${e.name}</div><div class="meta">Seed ${e.seed} · ${e.eyes} eyes</div><div class="chips"></div>`;
  const chips = card.querySelector(".chips");
  e.versions.forEach((v, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip" + (v.label.startsWith("Wildcard") ? " wild" : "");
    b.textContent = chipLabel(v.label);
    b.title = v.label; b.setAttribute("aria-label", `${e.name}: ${v.label}`);
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => fish.setVersion(i, true));
    chips.appendChild(b);
  });
  fish.card = card;
  cards.appendChild(card);
}
function updateCard(fish) {
  fish.card?.querySelectorAll(".chip").forEach((b, i) => b.setAttribute("aria-pressed", String(i === fish.version)));
}
function randomVersion(n) { return Math.random() < 0.62 ? Math.floor(Math.random() * 3) : 3 + Math.floor(Math.random() * (n - 3)); }

document.getElementById("feed").addEventListener("click", sprinkle);
document.getElementById("shuffle").addEventListener("click", () => {
  fishes.forEach((f, i) => setTimeout(() => {
    let v; do { v = randomVersion(f.entry.versions.length); } while (v === f.version);
    f.setVersion(v, true);
  }, i * 90));
});
const tray = document.getElementById("tray"), toggle = document.getElementById("toggle-tray");
toggle.addEventListener("click", () => {
  tray.hidden = !tray.hidden;
  toggle.textContent = tray.hidden ? "Show fish" : "Hide fish";
  toggle.setAttribute("aria-expanded", String(!tray.hidden));
});

// ---- tap a fish to cycle its paper ----
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
const hit = ev => {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObjects(pickables, false)[0]?.object.userData.fish;
};
renderer.domElement.addEventListener("pointerdown", ev => { downAt = [ev.clientX, ev.clientY]; });
renderer.domElement.addEventListener("pointerup", ev => {
  if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 6) return;
  const f = hit(ev);
  if (f) f.setVersion((f.version + 1) % f.entry.versions.length, true);
});
let hoverFrame = 0;
renderer.domElement.addEventListener("pointermove", ev => {
  if (ev.pointerType !== "mouse" || ++hoverFrame % 3) return;
  renderer.domElement.classList.toggle("over-fish", !!hit(ev));
});

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---- go ----
(async () => {
  let listing;
  try {
    listing = await (await fetch("fish/index.json")).json();
  } catch (err) {
    status.textContent = "The fish list did not load. Reload the page to try again.";
    return;
  }
  listing.forEach((entry, i) => { const f = new Fish(entry, i); fishes.push(f); buildCard(f); });
  let done = 0;
  await Promise.all(fishes.map(f => f.setVersion(randomVersion(f.entry.versions.length), false).then(() => {
    status.textContent = `Netting fish… ${++done} of ${fishes.length}`;
  }).catch(() => { status.textContent = "A fish did not load. Reload the page to try again."; })));
  status.textContent = `${fishes.length} fish · ${listing.reduce((n, e) => n + e.versions.length, 0)} paper versions`;
  setTimeout(sprinkle, 2500);
})();

const clock = new THREE.Clock();
const bm = new THREE.Matrix4(), bq = new THREE.Quaternion(), bs = new THREE.Vector3(), bp = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  time.value += dt;
  const t = time.value;
  for (const f of fishes) { f.update(dt, t); }
  for (const f of fishes) { f.group.updateMatrixWorld(); f.uniforms.uFishInv.value.copy(f.group.matrixWorld).invert(); }

  bubbleState.forEach((b, i) => {
    b.y += b.v * dt;
    if (b.y > WATER - 0.1) { b.y = BUBBLER.y; b.ph = rand(0, 6); }
    const rise = b.y - BUBBLER.y;
    bp.set(BUBBLER.x + Math.sin(t * 2.3 + b.ph) * 0.25 + rise * 0.04, b.y, BUBBLER.z + Math.cos(t * 2 + b.ph) * 0.25);
    bs.setScalar(b.s * (0.6 + Math.min(rise, 10) * 0.05));
    bubbles.setMatrixAt(i, bm.compose(bp, bq.identity(), bs));
  });
  bubbles.instanceMatrix.needsUpdate = true;

  for (let i = food.length - 1; i >= 0; i--) {
    const f = food[i], u = f.userData;
    if (u.delay > 0) { u.delay -= dt; continue; }
    const floorY = Math.max(FLOOR, -Math.sqrt(Math.max(0, R * R - f.position.x ** 2 - f.position.z ** 2))) + 1.0;
    if (f.position.y > floorY) {
      f.position.y -= u.sink * dt;
      f.position.x += Math.sin(t * 2 + u.ph) * dt * 0.5;
      f.rotation.x += dt * 1.5; f.rotation.y += dt;
    } else if ((u.rest += dt) > 10) { food.splice(i, 1); scene.remove(f); }
  }

  confettiState.forEach((c, i) => {
    if (c.life <= 0) { bs.setScalar(0); confetti.setMatrixAt(i, bm.compose(bp.set(0, -999, 0), bq.identity(), bs)); return; }
    c.life -= dt;
    c.v.multiplyScalar(Math.exp(-dt * 2.2)); c.v.y -= dt * 0.6;
    c.p.addScaledVector(c.v, dt);
    c.r.x += dt * c.spin; c.r.y += dt * c.spin * 0.7;
    bs.setScalar(Math.min(1, c.life / c.max * 2.5));
    confetti.setMatrixAt(i, bm.compose(c.p, bq.setFromEuler(c.r), bs));
  });
  confetti.instanceMatrix.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
});
</script>
